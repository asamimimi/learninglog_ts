# 1. ワークフローの名前
name: Todo App CI/CD Pipline

# 2. 実行されるタイミング（イベント）
on:
  push:
    branches: [ main ]

# 3. 処理のまとまり（ジョブ）
jobs:
  build:
    name: Build Phase  
    # 4. 動かす環境（OS）
    runs-on: ubuntu-latest

    # 5. 具体的な手順（ステップ・実行するコマンド）
    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload building artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-file
          path: dist/
          retention-days: 1


  test:
    name: Test Phase
    runs-on: ubuntu-latest
    
    steps:   
    - name: リポジトリのコードをチェックアウト
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run test
      run: npm run test

  deploy:
    name: Deploy phese
    runs-on: ubuntu-latest
    needs: [build,test]

    steps:   
    - name: リポジトリのコードをチェックアウト
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Download building artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-file
        path: dist/

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Install dependencies 
      run: npm install
    - name: Prepare Google Application Credentials
      run: |
        echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" | base64 --decode > $HOME/private-key.json

    - name: Deploy Firebase
      run: |
        export GOOGLE_APPLICATION_CREDENTIALS="$HOME/private-key.json"
        firebase experiments:enable webframeworks
        firebase deploy --only hosting --project learning-log-2fc7e

    - name: Remove private key 
      if: always()
      run: rm $HOME/private-key.json